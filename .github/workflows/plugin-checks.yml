name: Plugin checks

on:
  push:
    branches:
      - main
      - feature/code-example-insights
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js -- --config eslint.config.mjs

      - name: Lint styles
        run: npm run lint:css -- "src/**/*.scss" "assets/reader-insights-admin.css"

      - name: Build plugin assets
        run: npm run build
